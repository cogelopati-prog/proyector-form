<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0E0E">
<title>Proyecto R</title>
<link rel="preload" as="image" href="hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&family=Instrument+Serif&display=swap">
<style>
  :root{--bg:#0E0E0E;--ink:#FFFFFF;--field:#1F1F1F;--muted:#8A8A8A;--yellow:#FFC400;--track:#2A2A2A;--err:#FF8A80}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%}
  body{font-family:'Hanken Grotesk','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
  main{width:100%;max-width:440px;min-height:100svh;display:flex;flex-direction:column;padding-bottom:max(28px,env(safe-area-inset-bottom))}
  .hero{display:block;width:100%;aspect-ratio:780/560;object-fit:cover;background:var(--bg)}
  .body{flex:1;display:flex;flex-direction:column;gap:12px;padding:20px max(24px,env(safe-area-inset-right)) 0 max(24px,env(safe-area-inset-left))}
  h1{margin:4px 0 18px;text-align:center;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:32px;line-height:1}
  .f{position:relative}
  .f label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  input{width:100%;font:inherit;font-size:17px;border:0;border-radius:14px;padding:16px 48px 16px 18px;outline:none;background:var(--field);color:var(--ink);transition:background .25s,color .25s;-webkit-appearance:none;appearance:none}
  input::placeholder{color:var(--muted)}
  input:focus{box-shadow:0 0 0 2px #5A5A5A}
  .f.ok input{background:#FFFFFF;color:#0E0E0E}
  .f.ok input:focus{box-shadow:0 0 0 2px var(--yellow)}
  .check{position:absolute;right:18px;top:50%;width:18px;height:18px;margin-top:-9px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
  .f.ok .check{opacity:1;transform:scale(1)}
  .msg{margin:-2px 0 0;min-height:16px;font-size:13px;color:var(--err)}
  button{position:relative;overflow:hidden;margin-top:auto;font:inherit;font-size:13px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;border:0;border-radius:14px;padding:20px;background:var(--track);color:#FFFFFF;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button .fill{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--yellow);color:#0E0E0E;clip-path:inset(0 100% 0 0);transition:clip-path .35s ease}
  button:disabled{cursor:default}
  button:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
  .done{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 28px 40px}
  .done h2{margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:48px;line-height:1.05}
  .done p{margin:0;font-size:17px;color:var(--yellow)}
  .done .pass{margin-top:22px;color:var(--ink);font-size:20px;font-weight:500;line-height:1.3}
  .done button.next{margin-top:10px;width:100%;max-width:320px;background:var(--yellow);color:#0E0E0E}
  .done .auto{font-size:13px;color:var(--muted);min-height:16px}
  .sent .body{display:none}.sent .done{display:flex;animation:rise .45s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app">
  <img class="hero" src="hero.jpg" alt="Proyecto R">
  <!-- autocomplete off: en un iPad compartido evita que Safari sugiera los datos de la persona anterior -->
  <form class="body" id="form" novalidate autocomplete="off">
    <h1>Gracias por estar aquí.</h1>
    <div class="f"><label for="nombre">Nombre</label><input id="nombre" name="r_nombre" autocomplete="off" autocapitalize="words" enterkeyhint="next" placeholder="Nombre" maxlength="80" required><svg class="check" viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="f"><label for="telefono">Teléfono</label><input id="telefono" name="r_tel" type="tel" inputmode="tel" autocomplete="off" enterkeyhint="next" placeholder="Teléfono" maxlength="20" required><svg class="check" viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="f"><label for="email">Email</label><input id="email" name="r_correo" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" placeholder="Email" maxlength="160" required><svg class="check" viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="f"><label for="instagram">Instagram</label><input id="instagram" name="r_ig" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="@instagram" maxlength="31" required><svg class="check" viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <p class="msg" id="msg" role="alert"></p>
    <button id="btn" type="submit"><span id="lbl">0 de 4</span><span class="fill" id="fill" aria-hidden="true">0 de 4</span></button>
  </form>
  <section class="done" aria-live="polite">
    <h2 id="thanks">Gracias.</h2>
    <p>Revisa tu email.</p>
    <p class="pass">Pásale el iPad al próximo compañero.</p>
    <button type="button" class="next" id="next">Siguiente →</button>
    <p class="auto" id="auto"></p>
  </section>
</main>
<script>
const SUPABASE_URL="https://qkgjzdytwmivowrtlnhw.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrZ2p6ZHl0d21pdm93cnRsbmh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1ODA0ODEsImV4cCI6MjEwOTE1NjQ4MX0.tw9sz2V5XsDKcFhXKny0uIqVp73_SngLIiN0-OOfQc8";
const RESET_SEGUNDOS=15; // si nadie toca "Siguiente", vuelve solo al formulario
const universidad=(new URLSearchParams(location.search).get("u")||"").slice(0,80)||null;
const $=id=>document.getElementById(id);
const ids=["nombre","telefono","email","instagram"];
const digits=v=>{let d=v.replace(/\D/g,"");if(d.length===11&&d[0]==="1")d=d.slice(1);return d.slice(0,10)};
const fmt={
  nombre:v=>v.replace(/\s{2,}/g," ").slice(0,80),
  telefono:v=>{const d=digits(v);return d.length>6?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:d.length>3?`(${d.slice(0,3)}) ${d.slice(3)}`:d},
  email:v=>v.replace(/\s/g,"").toLowerCase().slice(0,160),
  instagram:v=>{const u=v.replace(/^.*instagram\.com\//i,"").replace(/[^A-Za-z0-9._@]/g,"").replace(/@/g,"");return u?"@"+u.slice(0,30):""}
};
const ok={
  nombre:v=>v.trim().length>=2,
  telefono:v=>digits(v).length===10,
  email:v=>/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/.test(v),
  instagram:v=>/^@[A-Za-z0-9._]{1,30}$/.test(v)
};
const errs={nombre:"Falta tu nombre.",telefono:"El teléfono son 10 dígitos.",email:"Revisa tu email.",instagram:"Falta tu Instagram."};
function refresh(){
  let n=0;
  ids.forEach(id=>{const good=ok[id]($(id).value);$(id).parentElement.classList.toggle("ok",good);if(good)n++});
  const t=n<4?`${n} de 4`:"Listo";
  $("lbl").textContent=t;$("fill").textContent=t;
  $("fill").style.clipPath=`inset(0 ${100-n*25}% 0 0)`;
  return n;
}
ids.forEach((id,i)=>{
  const el=$(id);
  el.addEventListener("input",()=>{const p=el.value,f=fmt[id](p);if(f!==p)el.value=f;$("msg").textContent="";refresh()});
  el.addEventListener("change",()=>{el.value=fmt[id](el.value);refresh()});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"&&i<ids.length-1){e.preventDefault();$(ids[i+1]).focus()}});
});

// Pantalla de gracias → próximo compañero
let timer=null;
function nuevo(){
  clearInterval(timer);timer=null;
  $("form").reset();
  $("msg").textContent="";$("auto").textContent="";
  $("btn").disabled=false;
  $("app").classList.remove("sent");
  refresh();window.scrollTo(0,0);
}
function iniciarCuenta(){
  let s=RESET_SEGUNDOS;
  const pinta=()=>$("auto").textContent=`Se reinicia en ${s} s`;
  pinta();
  timer=setInterval(()=>{s--;if(s<=0)nuevo();else pinta()},1000);
}
$("next").addEventListener("click",nuevo);

$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  ids.forEach(id=>$(id).value=fmt[id]($(id).value));
  refresh();
  const bad=ids.find(id=>!ok[id]($(id).value));
  if(bad){$("msg").textContent=errs[bad];$(bad).focus();return}
  const d={nombre:$("nombre").value.trim(),telefono:digits($("telefono").value),email:$("email").value,instagram:$("instagram").value,universidad};
  const btn=$("btn");btn.disabled=true;$("lbl").textContent=$("fill").textContent="Enviando…";
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/contactos",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(d)});
    if(!r.ok)throw new Error(r.status);
    $("thanks").textContent="Gracias, "+d.nombre.split(/\s+/)[0]+".";
    document.activeElement&&document.activeElement.blur();
    $("app").classList.add("sent");window.scrollTo(0,0);
    iniciarCuenta();
  }catch(err){
    $("msg").textContent="No se pudo enviar. Revisa tu conexión e intenta otra vez.";
    btn.disabled=false;refresh();
  }
});
refresh();
</script>
</body>
</html>
